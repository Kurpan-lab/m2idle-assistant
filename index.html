(()=>{'use strict';const KEY='m2idle_v04';const seed=JSON.parse(document.getElementById('seed').textContent);let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.maps)){state={maps:seed.maps,kills:{},enabled:false,base:null,settings:{rare:60,boss:60,metin:60},history:[]}};
const cats=[['normal','Zwykłe'],['rare','Rzadkie'],['boss','Bossowie'],['metin','Kamienie Metin']];let view={screen:'maps',map:null,loc:null};const $=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const map=()=>state.maps.find(x=>x.id===view.map);const loc=()=>map()?.locations.find(x=>x.id===view.loc);const all=()=>state.maps.flatMap(m=>m.locations.flatMap(l=>cats.flatMap(([c])=>l.targets[c].map((name,i)=>({m,l,c,name,i,key:l.id+'|'+c+'|'+i})))));const duration=c=>c==='normal'?0:Number(state.settings[c]||0);const remaining=t=>Math.max(0,((state.kills[t.key]||0)+duration(t.c)*60000-Date.now()));const clock=ms=>{let s=Math.ceil(ms/1000);return Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m '+String(s%60).padStart(2,'0')+'s'};const button=(name,fn,cls='')=>`<button class="${cls}" data-action="${fn}">${name}</button>`;const card=x=>`<div class="card">${x}</div>`;const stats=()=>`<div class="grid"><div class="stat"><strong>${state.maps.length}</strong><small>Map</small></div><div class="stat"><strong>${state.maps.reduce((n,m)=>n+m.locations.length,0)}</strong><small>Lokacji</small></div></div>`;
function render(){let out=`<div class="tabs">${button('Mapy','maps')}${button('Timery','timers')}${button('Ustawienia','settings')}</div>`;if(view.screen==='maps'){out+=stats()+card(`<div class="bar"><div><b>Asystent</b><br><small>${state.enabled?'Włączony – planowanie':'Wyłączony'}</small></div>${button(state.enabled?'WYŁĄCZ':'WŁĄCZ','toggle',state.enabled?'on':'off')}</div><small>Przełącznik steruje harmonogramem w tej aplikacji, nie postacią w grze.</small>`);state.maps.forEach(m=>out+=`<button class="map" data-map="${m.id}" ${m.soon?'disabled':''}><span><b>${esc(m.name)}</b><br><small>${m.locations.length} lokacji</small></span>${m.soon?'<span class="pill">Wkrótce</span>':'<span>›</span>'}</button>`)}else if(view.screen==='map'){out+=button('← Mapy','maps','back')+`<h2>${esc(map().name)}</h2>`;map().locations.forEach(l=>out+=`<button class="map" data-loc="${l.id}"><span><b>${esc(l.name)}</b><br><small>${l.level==null?'Poziom do uzupełnienia':'Poziom '+l.level} · ${l.verified?'Dane zapisane':'Do weryfikacji'}</small></span>›</button>`)}else if(view.screen==='loc'){const l=loc();out+=button('← Lokacje','backmap','back')+`<h2>${esc(l.name)}</h2>`+card(`<label>Wymagany poziom (opcjonalnie)</label><input id="level" type="number" min="1" value="${l.level??''}" placeholder="Do uzupełnienia">${button('Zapisz poziom','level')}<p class="muted">${l.verified?'Dane z wcześniejszych odczytów':'Niepełne / wymagają weryfikacji'}</p>`);for(const [c,label] of cats){out+=card(`<h3>${label} (${l.targets[c].length})</h3>`+(l.targets[c].length?l.targets[c].map((name,i)=>{let key=l.id+'|'+c+'|'+i,ms=remaining({key,c});return `<div class="target"><div><b>${esc(name)}</b><br><span class="timer" data-timer="${esc(key)}">${ms?clock(ms):'Gotowy / brak odliczania'}</span></div>${button('Zabity','kill:'+c+':'+i)}</div>`}).join(''):'<p class="empty">Brak zapisanych celów</p>')+`<details><summary>Dodaj / popraw cele</summary><label>Jedna nazwa w każdej linii</label><textarea data-category="${c}" style="width:100%;min-height:90px;background:#101520;color:white;border-radius:10px;padding:10px">${esc(l.targets[c].join('\n'))}</textarea>${button('Zapisz kategorię','edit:'+c)}</details>`)}out+=card(`<h3>Bazowy zwykły potwór</h3><label>Wybierz</label><select id="base"><option value="">Brak</option>${l.targets.normal.map((n,i)=>`<option value="${i}" ${state.base?.loc===l.id&&state.base?.index===i?'selected':''}>${esc(n)}</option>`).join('')}</select>${button('Ustaw bazę','base')}`)}else if(view.screen==='timers'){out+=`<h2>Aktywne odliczanie</h2>`;let active=all().filter(t=>duration(t.c)>0&&state.kills[t.key]).sort((a,b)=>remaining(a)-remaining(b));out+=active.length?active.map(t=>card(`<b>${esc(t.name)}</b><br><small>${esc(t.m.name)} / ${esc(t.l.name)}</small><br><span class="timer" data-timer="${esc(t.key)}">${remaining(t)?clock(remaining(t)):'Gotowy'}</span>`)).join(''):card('Nie ma jeszcze oznaczonych zabitych celów.');}else if(view.screen==='settings'){out+=`<h2>Ustawienia</h2>`+card(`<p class="muted">Domyślne odnowienia w minutach. Wartości robocze — dopasuj do gry.</p>`+cats.filter(([c])=>c!=='normal').map(([c,n])=>`<label>${n}</label><input type="number" min="0" id="cool_${c}" value="${state.settings[c]}">`).join('')+button('Zapisz czasy','cooldowns','primary'))+card(`<h3>Kopia zapasowa</h3><div class="actions">${button('Eksport JSON','export')}${button('Import JSON','import')}</div><input type="file" id="file" accept="application/json,.json" hidden><p class="muted">Dane zapisują się lokalnie w tej przeglądarce. Eksportuj kopię przed zmianą urządzenia.</p>`)+card(`<h3>Aktualizacja bazy</h3><p class="muted">Jeśli aplikacja była używana wcześniej, przywrócenie bazy v0.4 usuwa lokalne zmiany i historię.</p>${button('Przywróć bazę v0.4','reset')}`)}$.innerHTML=out;}
function go(s){view.screen=s;render();window.scrollTo(0,0)}
$.addEventListener('click',e=>{const mb=e.target.closest('[data-map]'),lb=e.target.closest('[data-loc]'),b=e.target.closest('[data-action]');if(mb){view.map=mb.dataset.map;go('map');return}if(lb){view.loc=lb.dataset.loc;go('loc');return}if(!b)return;const a=b.dataset.action;if(['maps','timers','settings'].includes(a))return go(a);if(a==='backmap')return go('map');if(a==='toggle'){state.enabled=!state.enabled;save();return render()}if(a==='level'){const v=document.getElementById('level').value;loc().level=v===''?null:Number(v);save();return render()}if(a==='base'){const v=document.getElementById('base').value;state.base=v===''?null:{loc:loc().id,index:Number(v)};save();return render()}if(a.startsWith('kill:')){const [,c,i]=a.split(':');let key=loc().id+'|'+c+'|'+i;state.kills[key]=Date.now();state.history.unshift({key,at:state.kills[key]});state.history=state.history.slice(0,300);save();return render()}if(a.startsWith('edit:')){let c=a.split(':')[1],input=$.querySelector('textarea[data-category="'+c+'"]');loc().targets[c]=input.value.split('\n').map(x=>x.trim()).filter(Boolean);loc().verified=false;save();return render()}if(a==='cooldowns'){for(const [c] of cats)if(c!=='normal')state.settings[c]=Math.max(0,Number(document.getElementById('cool_'+c).value)||0);save();return render()}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='m2idle-backup.json';el.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='import'){const input=document.getElementById('file');input.click();input.onchange=async()=>{try{let v=JSON.parse(await input.files[0].text());if(!Array.isArray(v.maps))throw Error('Brak map');state=v;save();go('maps')}catch{alert('Niepoprawny plik kopii zapasowej')}};return}if(a==='reset'&&confirm('Usunąć lokalne zmiany i przywrócić bazę?')){localStorage.removeItem(KEY);location.reload()}});setInterval(()=>{document.querySelectorAll('[data-timer]').forEach(el=>{const t=all().find(x=>x.key===el.dataset.timer);if(t)el.textContent=remaining(t)?clock(remaining(t)):'Gotowy'})},1000);render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();</script><footer>Prototyp offline • Bez integracji ze sterowaniem M2Idle</footer></body></html>
