function apiSetStatus(msg,cls=''){apiStatus=msg;apiStatusClass=cls;const e=document.getElementById('api-status');if(e){e.className=cls||'subtle';e.textContent=msg}}
function apiNormalize(data,source){if(!data||!Array.isArray(data.targets))throw Error('Brak tablicy targets');apiTargets=data.targets.filter(t=>t&&typeof t==='object').map(t=>({enemyId:String(t.enemyId??''),zoneId:String(t.zoneId??''),name:String(t.namePl||t.name||'Nieznany cel'),map:String(t.mapNamePl||''),cooldown:Number.isFinite(Number(t.cooldownSeconds))?Math.max(0,Number(t.cooldownSeconds)):null,remaining:Number.isFinite(Number(t.remainingCooldownSeconds))?Math.max(0,Number(t.remainingCooldownSeconds)):null}));apiReceived=Date.now();apiSource=source;apiSetStatus('Wczytano '+apiTargets.length+' celów • '+source,source==='API'?'good':'warning');apiRender()}

$.addEventListener('change',e=>{if(e.target.matches('[data-basepick]'))updatePick();if(e.target.id==='seqmap')refreshSeqSelects('map');if(e.target.id==='seqloc')refreshSeqSelects('loc')});
$.addEventListener('click',e=>{const mb=e.target.closest('[data-map]'),lb=e.target.closest('[data-loc]'),b=e.target.closest('[data-action]');if(mb){view.map=mb.dataset.map;return go('map')}if(lb){view.loc=lb.dataset.loc;return go('loc')}if(!b)return;const a=b.dataset.action;if(['maps','timers','settings','schedule','sequence','api'].includes(a))return go(a);if(a.startsWith('api'))return apiAction(a);;if(a==='backmap')return go('map');if(a==='toggle'){state.enabled=!state.enabled;if(!state.enabled)state.sequenceActive=false;state.autoNextAt=0;save();return render()}if(a==='openbase'){const b=baseInfo();if(b){view.map=b.m.id;view.loc=b.l.id;return go('loc')}return go('maps')}
if(a==='seqadd'){const key=document.getElementById('seqtarget')?.value;if(!key)return alert('Wybierz lokację z dostępnym celem.');if(state.sequence.includes(key))return alert('Ten cel już jest w sekwencji.');state.sequence.push(key);state.sequenceActive=false;state.sequencePos=0;state.autoNextAt=0;save();return render()}
if(a.startsWith('seqremove:')||a.startsWith('sequp:')||a.startsWith('seqdown:')){const [op,raw]=a.split(':'),i=Number(raw);if(op==='seqremove')state.sequence.splice(i,1);if(op==='sequp'&&i>0)[state.sequence[i-1],state.sequence[i]]=[state.sequence[i],state.sequence[i-1]];if(op==='seqdown'&&i<state.sequence.length-1)[state.sequence[i+1],state.sequence[i]]=[state.sequence[i],state.sequence[i+1]];state.sequenceActive=false;state.sequencePos=0;state.autoNextAt=0;save();return render()}
if(a==='autocycle'){state.autoCycle=!state.autoCycle;if(state.autoCycle&&seqComplete())state.autoNextAt=nextCycleAt();save();autoCycleCheck();return render()}
if(a==='seqstart'||a==='seqrestart'){if(!baseInfo())return alert('Najpierw zapisz zestaw bazowy.');if(!state.sequence.length)return alert('Dodaj co najmniej jeden cel.');state.sequencePos=0;state.sequenceActive=true;state.enabled=true;state.autoNextAt=0;save();return render()}
if(a==='seqstop'){state.sequenceActive=false;state.autoNextAt=0;save();return render()}
if(a==='seqkill'){const t=seqStatus();if(!state.sequenceActive||!t)return;if(t.ms>0)return alert('Ten cel jeszcze się odnawia.');if(!confirm('Potwierdzasz zabicie: '+t.name+'?'))return;const now=Date.now();state.kills[t.key]=now;state.history.unshift({key:t.key,at:now});state.history=state.history.slice(0,300);state.sequencePos++;if(seqComplete())state.autoNextAt=nextCycleAt();save();autoCycleCheck();return render()}
if(a==='level'){const v=document.getElementById('level').value;loc().level=v===''?null:Number(v);save();return render()}
if(a==='base'){const indices=[...$.querySelectorAll('[data-basepick]:checked')].map(x=>Number(x.dataset.basepick));if(indices.length<1||indices.length>3)return alert('Wybierz od 1 do 3 zwykłych potworów.');state.baseGroup={loc:loc().id,indices};state.base={loc:loc().id,index:indices[0]};save();render();return alert('Zapisano zestaw '+indices.length+' zwykłych potworów.')}
if(a==='clearbase'){if(confirm('Wyczyścić zestaw bazowy?')){state.baseGroup=null;state.base=null;save();render()}return}
if(a.startsWith('kill:')){const [,c,i]=a.split(':');let key=loc().id+'|'+c+'|'+i;state.kills[key]=Date.now();state.history.unshift({key,at:state.kills[key]});state.history=state.history.slice(0,300);save();return render()}
if(a.startsWith('edit:')){let c=a.split(':')[1],input=$.querySelector('textarea[data-category="'+c+'"]');const old=loc().targets[c];const next=input.value.split('\n').map(x=>x.trim()).filter(Boolean);if(old.join('\n')!==next.join('\n')&&!confirm('Zmiana kolejności celów może przypisać istniejące timery do innych nazw. Kontynuować?'))return;loc().targets[c]=next;loc().verified=false;if(c==='normal'&&state.baseGroup?.loc===loc().id){const names=state.baseGroup.indices.map(i=>old[i]);const indices=names.map(n=>next.indexOf(n)).filter(i=>i>=0);state.baseGroup=indices.length?{loc:loc().id,indices:[...new Set(indices)].slice(0,3)}:null;state.base=state.baseGroup?{loc:loc().id,index:state.baseGroup.indices[0]}:null}save();return render()}
if(a==='cooldowns'){for(const [c] of cats)if(c!=='normal')state.settings[c]=Math.max(0,Number(document.getElementById('cool_'+c).value)||0);save();return render()}
if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='m2idle-backup-v07.json';el.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
if(a==='import'){const input=document.getElementById('file');input.click();input.onchange=async()=>{try{if(!input.files?.[0])return;let v=JSON.parse(await input.files[0].text());if(!Array.isArray(v.maps)||!v.maps.every(m=>Array.isArray(m.locations)))throw Error('Brak map');if(!confirm('Import zastąpi aktualne lokalne ustawienia i timery. Kontynuować?'))return;state=v;state.kills||={};state.history||=[];state.settings||={rare:60,boss:60,metin:60};state.sequence||=[];state.sequencePos=Math.max(0,Number(state.sequencePos)||0);state.sequenceActive=false;state.autoCycle=v.autoCycle===true;state.autoNextAt=0;if(!state.baseGroup)state.baseGroup=state.base?{loc:state.base.loc,indices:[Number(state.base.index)]}:null;save();go('maps')}catch{alert('Niepoprawny plik kopii zapasowej')}};return}
if(a==='reset'&&confirm('Usunąć lokalne zmiany i przywrócić bazę?')){localStorage.removeItem(KEY);location.reload()}});
setInterval(()=>{const list=all(),byKey=new Map(list.map(t=>[t.key,t]));document.querySelectorAll('[data-timer]').forEach(el=>{const t=byKey.get(el.dataset.timer);if(t)el.textContent=t.c==='normal'?'Bez timera':remaining(t)?clock(remaining(t)):'Gotowy'})},1000);
setInterval(()=>{const changed=autoCycleCheck();if(changed){render();return}const countdown=document.querySelector('[data-auto-countdown]');if(countdown&&seqComplete()){const at=state.autoNextAt||nextCycleAt();if(at)countdown.textContent=clock(Math.max(0,at-Date.now()))}},1000);
setInterval(()=>{if(state.sequenceActive&&view.screen!=='loc'&&view.screen!=='map'){const t=seqStatus();if(t&&t.ms===0){const button=document.querySelector('[data-action=seqkill]');if(!button)render()}}},2000);
autoCycleCheck();render();// TEST: nie rejestrujemy osobnego service workera
})();</script><footer>v0.9 TEST • Dane testowe oddzielone od v0.7 • Bez sterowania grą</footer></body></html>
